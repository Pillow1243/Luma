name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability scan
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run lint

      - name: Build web bundle
        run: npm run build
        env:
          # Publishable anon key — public by design, safe for CI.
          VITE_SUPABASE_URL: https://lnhmbjqjfrnqkpsjpszb.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_XpWiwKw-bTG_au74ylwn8A_SYeJQWLE
          VITE_APP_URL: https://luma-messenger-chi.vercel.app

      - name: WebRTC browser smoke test (mock backend)
        run: npm run test:browser:calls
        timeout-minutes: 5
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Check migrations are present
        run: |
          ls supabase/migrations/*.sql | sort
          test -f supabase/migrations/20261109000000_luma_v3_1_schema.sql
          test -f supabase/migrations/20261110120000_luma_security_and_ratchet.sql

  # ---------------------------------------------------------------------------
  # Database suites. These replay supabase/baseline/ + supabase/migrations/ on a
  # throwaway PostgreSQL and then attack the result as multiple users, so they
  # need no Supabase credentials and touch no real data.
  # ---------------------------------------------------------------------------
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:55432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install contrib extensions (citext, pg_trgm, pgcrypto)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-contrib-16 || true

      # GitHub job logs are not reachable from every environment, so a failure
      # has to explain itself through an annotation instead of a log tail.
      - name: Database suites (replay + authorization + parity)
        run: bash scripts/ci-db.sh

# NOTE: the live RLS authorization suite (tests/rls-tests.mjs) runs manually
# against the production Supabase project — it creates throwaway accounts, so
# it deliberately does not run on every PR. See README → "Testing".
